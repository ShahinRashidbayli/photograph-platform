spring:
  flyway:
    url:
    user:
    password:
    locations: classpath:db/migration
    schemas: public

  jpa:
    hibernate:
      # 'none' (matching production) — not 'validate'. In this schema-per-tenant
      # app the tenant tables (bookings, photos, ...) live in tenant_* schemas
      # created on demand by TenantSchemaInitializer, so a startup-time validate
      # against the public schema cannot see them and fails the context.
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6370  # overridden by EmbeddedRedis in tests

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0cy1vbmx5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=  # pragma: allowlist secret
    access-token-expiry-ms: 86400000
    refresh-token-expiry-ms: 2592000000
