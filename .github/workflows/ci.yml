name: CI

on:
  # `main` was push-only, so a pull request INTO main ran no checks at all —
  # the one moment they matter most. Both long-lived branches are gated now.
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]

# ─────────────────────────────────────────────────────────────────────────────
# Job dependency graph:
#
#   format ──┐
#   lint   ──┤──► build
#   test-api─┤
#   test-web─┘
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. FORMAT ──────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java: Checkstyle
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - name: Checkstyle (Java)
        working-directory: apps/api
        run: mvn -B checkstyle:check

      # TypeScript / TSX: Prettier
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prettier (TypeScript / TSX)
        run: npm run format:check --workspace=apps/web

  # ── 2. LINT ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: ESLint (TypeScript)
        run: npm run lint --workspace=apps/web

      # The build job would catch a type error eventually, but it runs after
      # every other job and takes minutes; tsc answers in seconds and says
      # exactly which line.
      - name: Typecheck (tsc)
        run: npm run typecheck --workspace=apps/web

      # Catches what the compiler cannot see inside translation strings:
      # a placeholder renamed in one locale only, a plural form missing the
      # categories its language requires, an orphaned key. All of these ship
      # silently and surface as broken copy in front of a user.
      - name: i18n dictionaries
        run: npm run i18n:check --workspace=apps/web

  # ── 3. TEST — API ──────────────────────────────────────────
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - name: Run JUnit tests
        working-directory: apps/api
        run: mvn -B test

  # ── 4. TEST — WEB ──────────────────────────────────────────
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Jest tests
        run: npm run test --workspace=apps/web -- --passWithNoTests

  # ── 5. AUDIT — dependency vulnerabilities ──────────────────
  # Five jobs used to run here and none of them looked at what the
  # dependencies were. `npm audit` reported two HIGH advisories that had been
  # in the tree for some time with nothing to surface them; a green pipeline
  # said nothing about that either way.
  #
  # This gates on HIGH and above only. A build that fails on every `low` in a
  # 600-package dev tree gets bypassed within a week, and a gate people bypass
  # is worse than no gate — it also teaches them to ignore the real ones.
  #
  # Java has no equivalent step on purpose: OWASP Dependency-Check needs an NVD
  # API key and several minutes of NVD downloads, which makes it flaky as a
  # required check. It runs on its own schedule instead — see
  # .github/workflows/security-audit.yml — with Dependabot covering advisories
  # published between runs.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ REPORTING ONLY, AND THIS IS TEMPORARY.
      #
      # This step fails today. The tree carries two HIGH advisories — next, and
      # sharp via libvips — and clearing them needs next@16, a semver-major
      # upgrade that is its own piece of work.
      #
      # Merging it as a required check would therefore block every pull request
      # from the moment it lands, on a problem unrelated to whatever is being
      # merged. That is how a security gate gets deleted rather than satisfied.
      # So it reports for now, visibly, and the job is not silently absent.
      #
      # REMOVE continue-on-error once the Next upgrade lands. A reporting-only
      # audit that nobody ever promotes is just a slower way of having no audit.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── 6. BUILD ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build API (Spring Boot JAR)
        working-directory: apps/api
        run: mvn -B package -DskipTests

      - name: Build Web (Next.js)
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

  # ── 7. DOCKER IMAGES ───────────────────────────────────────
  # Builds both deployment images without pushing them. The `build` job above
  # compiles the same source with Maven and Next directly, which is NOT the
  # same check: it never exercises the Dockerfiles, so a broken base image, a
  # missing runtime package or a wrong standalone-bundle path would only be
  # discovered by a failed production deploy. Both images build from the
  # repository root as context.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [format, lint, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: fotolio-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # API_BASE_URL is a build arg by necessity — Next bakes the /api/*
      # rewrite destination into routes-manifest.json at build time. The image
      # refuses to build without it, so passing a placeholder here also proves
      # that guard still works.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: fotolio-web:ci
          build-args: |
            API_BASE_URL=http://api.internal:8080
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # A built image that dies on boot still fails the deploy. Start each one
      # and wait for it to answer on the port it will actually serve.
      - name: Smoke-test web image
        run: |
          docker run -d --name web -p 3000:3000 fotolio-web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "web image serves /login"; exit 0
            fi
            sleep 2
          done
          echo "web image never became ready"; docker logs web; exit 1

      - name: Smoke-test API image (migrate mode refuses bad config)
        run: |
          # No FLYWAY_URL — the entrypoint must fail loudly rather than boot
          # and silently skip migrations.
          if docker run --rm fotolio-api:ci migrate; then
            echo "migrate should have failed without FLYWAY_URL"; exit 1
          fi
          echo "migrate mode correctly refuses incomplete config"
