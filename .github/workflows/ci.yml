name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      # Tests use the "test" Spring profile which auto-configures H2 — no DB secrets needed.
      - run: mvn -B test

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the npm global cache, not node_modules.
      # npm ci deletes node_modules before reinstalling, so caching it is wasteful.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - run: npm ci
      - run: npm test -- --passWithNoTests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Checkstyle
        working-directory: apps/api
        run: mvn -B checkstyle:check

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: [test-api, test-web, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Build API
        working-directory: apps/api
        run: mvn -B package -DskipTests

      - name: Build Web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
