# ArchUnit — see ArchitectureTest.
#
# Store creation is OFF. The baseline in archunit_store/ is committed, and a
# missing store must fail rather than quietly write a fresh one: an empty
# baseline records "no violations exist" and every frozen rule then passes on a
# codebase nobody has checked. Silently re-baselining is the one failure mode a
# freeze has, and it looks exactly like success.
#
# Legitimate reasons the store is missing are rare (a first checkout has it, it
# is version-controlled). If you genuinely need to recreate it:
#
#   mvn test -Dtest=ArchitectureTest \
#            -Darchunit.freeze.store.default.allowStoreCreation=true
#
# To record a new baseline after deliberately changing the module structure —
# NOT to make a failing build pass:
#
#   mvn test -Dtest=ArchitectureTest -Darchunit.freeze.refreeze=true
freeze.store.default.allowStoreCreation=false

# Violations that disappear are removed from the store, so the baseline can only
# shrink. This is what makes it a ratchet rather than a permanent amnesty: pay a
# cycle down and it can never come back without failing the build.
freeze.store.default.allowStoreUpdate=true
