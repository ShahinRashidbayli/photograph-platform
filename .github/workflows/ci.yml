name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────
# Job dependency graph:
#
#   format ──┐
#   lint   ──┤──► build
#   test-api─┤
#   test-web─┘
# ─────────────────────────────────────────────────────────────

jobs:

  # ── 1. FORMAT ──────────────────────────────────────────────
  # Fails fast: wrong indentation, trailing spaces, blank lines,
  # or any style violation blocks everything else.
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java: Checkstyle (indentation, naming, whitespace, imports)
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - name: Checkstyle (Java)
        working-directory: apps/api
        run: mvn -B checkstyle:check

      # TypeScript / TSX: Prettier (spacing, quotes, trailing commas)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Prettier (TypeScript / TSX)
        working-directory: apps/web
        run: npm run format:check

  # ── 2. LINT ────────────────────────────────────────────────
  # Static analysis on top of formatting:
  # unused variables, React rules, accessibility hints.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: ESLint (TypeScript)
        working-directory: apps/web
        run: npm run lint

  # ── 3. TEST — API ──────────────────────────────────────────
  # JUnit tests run with H2 in-memory DB.
  # No DB secrets needed; the "test" Spring profile handles it.
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - name: Run JUnit tests
        run: mvn -B test

  # ── 4. TEST — WEB ──────────────────────────────────────────
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Install web deps
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --passWithNoTests

  # ── 5. BUILD ───────────────────────────────────────────────
  # Runs only when format, lint, and all tests pass.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Build API (Spring Boot JAR)
        working-directory: apps/api
        run: mvn -B package -DskipTests

      - name: Build Web (Next.js)
        working-directory: apps/web
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
