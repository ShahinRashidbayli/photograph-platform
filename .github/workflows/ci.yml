name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# Job dependency graph:
#
#   format ──┐
#   lint   ──┤──► build
#   test-api─┤
#   test-web─┘
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. FORMAT ──────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java: Checkstyle
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - name: Checkstyle (Java)
        working-directory: apps/api
        run: mvn -B checkstyle:check

      # TypeScript / TSX: Prettier
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prettier (TypeScript / TSX)
        run: npm run format:check --workspace=apps/web

  # ── 2. LINT ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: ESLint (TypeScript)
        run: npm run lint --workspace=apps/web

  # ── 3. TEST — API ──────────────────────────────────────────
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - name: Run JUnit tests
        working-directory: apps/api
        run: mvn -B test

  # ── 4. TEST — WEB ──────────────────────────────────────────
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Jest tests
        run: npm run test --workspace=apps/web -- --passWithNoTests

  # ── 5. BUILD ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install all workspace deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build API (Spring Boot JAR)
        working-directory: apps/api
        run: mvn -B package -DskipTests

      - name: Build Web (Next.js)
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
