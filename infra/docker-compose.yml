services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: centralidp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-U postgres"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Object storage ────────────────────────────────────────────────────────
  # Stands in for Cloudflare R2 locally. R2 *is* the S3 API, so the same AWS
  # SDK client, the same presigned upload flow and the same keys work against
  # both — only the endpoint and the addressing style differ (see
  # R2Properties#pathStyle).
  #
  # Without this, media upload was the one core feature that could not run on a
  # fresh checkout: app.r2.* defaulted to literal "placeholder" credentials, so
  # portfolio uploads and gallery delivery silently did nothing.
  #
  # MINIO_API_CORS_ALLOW_ORIGIN is required because the browser PUTs to the
  # presigned URL directly, cross-origin from localhost:3000. Wide-open here is
  # fine — it is a throwaway dev container; R2 needs its own CORS policy set on
  # the bucket (see infra/README.md).
  #
  # pgsty/minio and pgsty/mc, the community-maintained forks of MinIO's
  # server and client. MinIO's own images can no longer be pulled anonymously
  # from anywhere: the Docker Hub repos refuse it, and quay.io — where this
  # file moved to for that reason — has answered 401 on every tag since
  # September 2026. A fresh checkout's `make infra` died on the pull.
  #
  # Pinned by digest as well as tag. A fork is a second party in the supply
  # chain, so a tag that is quietly re-pushed should fail the pull rather than
  # run. Bumping means replacing both halves together.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fotolio_dev
      MINIO_ROOT_PASSWORD: fotolio_dev_secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (fotolio_dev / fotolio_dev_secret)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket the API expects, then exit. Idempotent, so it
  # is safe on every `docker compose up`.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fotolio_dev fotolio_dev_secret &&
      mc mb --ignore-existing local/fotolio-media-dev &&
      echo 'MinIO bucket fotolio-media-dev ready'
      "

volumes:
  postgres_data:
  minio_data:
