name: PR Title Check

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern="^(feat|fix|chore|docs|test|refactor|ci|perf|style|revert)(\(.+\))?: .{1,}"
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "❌ PR title must start with a Conventional Commits type."
            echo ""
            echo "   Allowed prefixes: feat | fix | chore | docs | test | refactor | ci | perf | style | revert"
            echo "   Examples:"
            echo "     feat: add photo upload endpoint"
            echo "     fix: correct tenant slug validation"
            echo "     chore: update dependencies"
            echo ""
            echo "   Got: \"$TITLE\""
            exit 1
          fi
          echo "✅ PR title is valid: \"$TITLE\""
